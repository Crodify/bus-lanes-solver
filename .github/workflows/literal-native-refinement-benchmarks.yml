name: Literal benchmark.sh pinned comparisons

on:
  push:
    branches: [diagnostic/native-refinement-previews-20261102]
    paths:
      - .github/workflows/literal-native-refinement-benchmarks.yml
      - scripts/assemble-literal-native-benchmarks.ts
  workflow_dispatch:

permissions:
  contents: write

env:
  BUN_JSC_forceRAMSize: "2147483648"
  BUN_JSC_miniVMHeapGrowthFactor: "1.05"

jobs:
  compare:
    name: benchmark.sh PR ${{ matrix.pr }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 131
            base: 0bbdd1a7a73fa410c081215ca290c8613d84f89c
            head: 8559d631d23c8b93ecf79d177aa457adc251ef50
          - pr: 132
            base: 8559d631d23c8b93ecf79d177aa457adc251ef50
            head: 380c3fa58c4e934302de35a8486443f571914a45
          - pr: 133
            base: 380c3fa58c4e934302de35a8486443f571914a45
            head: d5b319ff2991671c56daaf9f264e9ef4bf3151db
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.base }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          path: head
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install both pinned revisions before timing
        run: |
          (cd base && bun install)
          (cd head && bun install)
          mkdir -p literal
      - name: Fresh complete base dataset through benchmark.sh
        id: base
        continue-on-error: true
        working-directory: base
        run: ./benchmark.sh --timeout-seconds 3600 --require-all-solved --solver "$GITHUB_WORKSPACE/base/lib/index.ts" --output "$GITHUB_WORKSPACE/literal/base.json"
      - name: Fresh complete head dataset through the same base harness
        id: head
        continue-on-error: true
        working-directory: base
        run: ./benchmark.sh --timeout-seconds 3600 --require-all-solved --solver "$GITHUB_WORKSPACE/head/lib/index.ts" --output "$GITHUB_WORKSPACE/literal/head.json"
      - name: Assemble paired records and intended comparison
        env:
          BASE_SHA: ${{ matrix.base }}
          HEAD_SHA: ${{ matrix.head }}
          PR_NUMBER: ${{ matrix.pr }}
          SOURCE_RUN_URL: https://github.com/tscircuit/bus-lanes-solver/actions/runs/${{ github.run_id }}
        run: |
          bun controller/scripts/assemble-literal-native-benchmarks.ts
          bun controller/scripts/review-pinned-benchmark-summary.ts
      - name: Retain benchmark reports and intended summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literal-benchmark-pr-${{ matrix.pr }}
          path: |
            literal/
            reports/
            reviewed-comparison.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish only the comparison Markdown review blob
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs")
            const markdown = fs.readFileSync("reviewed-comparison.md", "utf8")
            core.summary.addRaw(markdown)
            await core.summary.write()
            const result = await github.rest.git.createBlob({...context.repo, content: markdown, encoding: "utf-8"})
            console.log("LITERAL_BENCHMARK_SUMMARY " + JSON.stringify({
              pr: ${{ matrix.pr }}, run: context.runId,
              base: "${{ matrix.base }}", head: "${{ matrix.head }}", sha: result.data.sha,
            }))
      - name: Require both fresh complete datasets
        if: always()
        env:
          BASE_OUTCOME: ${{ steps.base.outcome }}
          HEAD_OUTCOME: ${{ steps.head.outcome }}
        run: test "$BASE_OUTCOME" = success && test "$HEAD_OUTCOME" = success
