name: Review pinned benchmark summaries

on:
  push:
    branches: [diagnostic/native-refinement-previews-20261102]
    paths:
      - .github/workflows/review-pinned-benchmark-summaries.yml
      - scripts/review-pinned-benchmark-summary.ts
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  summarize:
    name: Comparison PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 130
            run: 41347189304
            base: 1b172b92c7fb2eb94ff89bd1d3899b682b3f96d0
            head: 0bbdd1a7a73fa410c081215ca290c8613d84f89c
          - pr: 131
            run: 41449760820
            base: 0bbdd1a7a73fa410c081215ca290c8613d84f89c
            head: 8559d631d23c8b93ecf79d177aa457adc251ef50
          - pr: 132
            run: 41454058694
            base: 8559d631d23c8b93ecf79d177aa457adc251ef50
            head: 380c3fa58c4e934302de35a8486443f571914a45
          - pr: 133
            run: 41454426435
            base: 380c3fa58c4e934302de35a8486443f571914a45
            head: d5b319ff2991671c56daaf9f264e9ef4bf3151db
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Wait for the pinned source run to complete
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 120 * 60 * 1000
            while (true) {
              const run = await github.rest.actions.getWorkflowRun({...context.repo, run_id: ${{ matrix.run }}})
              if (run.data.status === "completed") {
                console.log("Source run concluded: " + run.data.conclusion)
                break
              }
              if (Date.now() > deadline) throw Error("Source benchmark has not completed")
              await new Promise(resolve => setTimeout(resolve, 30000))
            }
      - uses: actions/download-artifact@v4
        with:
          pattern: am3352-*
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: reports
      - name: Render the existing comparison and concise requested audit metrics
        env:
          BASE_SHA: ${{ matrix.base }}
          HEAD_SHA: ${{ matrix.head }}
          PR_NUMBER: ${{ matrix.pr }}
          SOURCE_RUN_URL: https://github.com/tscircuit/bus-lanes-solver/actions/runs/${{ matrix.run }}
        run: bun scripts/review-pinned-benchmark-summary.ts
      - name: Publish only the intended Markdown comparison as a review blob
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs")
            const markdown = fs.readFileSync("reviewed-comparison.md", "utf8")
            core.summary.addRaw(markdown)
            await core.summary.write()
            const result = await github.rest.git.createBlob({
              ...context.repo, content: markdown, encoding: "utf-8",
            })
            console.log("BENCHMARK_SUMMARY " + JSON.stringify({
              pr: ${{ matrix.pr }}, run: ${{ matrix.run }},
              base: "${{ matrix.base }}", head: "${{ matrix.head }}",
              sha: result.data.sha,
            }))
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-comparison-pr-${{ matrix.pr }}
          path: reviewed-comparison.md
          if-no-files-found: error
          retention-days: 30
